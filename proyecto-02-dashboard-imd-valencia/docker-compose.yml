services:
  datos:
    image: trafico-datos:latest
    volumes:
      - trafico-datos:/data
    ports:
      - "${DATA_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    image: trafico-web:latest
    environment:
      API_UPSTREAM: datos:8000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - datos
    restart: unless-stopped

volumes:
  trafico-datos:
